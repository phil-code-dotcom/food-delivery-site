<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
</head>

<body>
    <header class="w-full max-w-[1600px] mx-auto">
        <div class="flex justify-between xl:px-[145px] px-5 md:pt-[62px] pt-5 font-inter items-center">
            <img class="w-[42px] h-[42px]" src="./img/logo.png" alt="">
            <nav class="hidden md:flex gap-[45px] font-medium items-center">
                <p>Restaurants</p>
                <p>Recipes</p>
                <p>About</p>
                <div class="flex items-center">
                    <p>Pages </p>
                    <svg class="w-[20px] h-[12px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path
                            d="M201.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 338.7 54.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z" />
                    </svg>
                </div>
            </nav>
            <div class="flex items-center justify-center gap-4">
                <button class="text-white font-inter font-semibold bg-[#E94339] w-[115px] h-[52px] rounded-full">Sign
                    up</button>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="w-7 flex md:hidden">
                    <path
                        d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
                </svg>
            </div>
        </div>
    </header>

    <!--the hero section-->
    <section class="flex w-[1264px] h-[478px] gap-[109px] mx-[168px] mt-[111px] font-inter">
        <div class="mt-10">
            <h1 class="w-[585px] text-[61px] text-[#191720] font-bold leading-tight">Your Favorite Food Delivery Partner
            </h1>
            <p
                class="w-[528px] h-[60px] text-[#191720] font-normal text-[18px] leading-[30px] tracking-[-1%] mt-[20px]">
                The food at your doorstep. Why starve when you have us. You hunger partner. Straight out of the oven to
                your doorstep.</p>
            <div class=" flex mt-[24px]">
                <input class="w-[464px] h-[64px] bg-[#F6F6F6] rounded-full pl-[30px]" type="search"
                    placeholder="Enter your delivery location">
                <button
                    class="absolute w-[134px] h-[52px] translate-x-[324px] mt-[6px] bg-[#FF5331] text-white rounded-full">Order
                    now</button>
            </div>
            <div class="flex gap-[45px]">
                <div class="flex gap-[8px] w-[170px] h-[65px] bg-[#F4F4F4] rounded-xl mt-[33px] place-items-center">
                    <svg class="w-[47px] h-[40px] ml-[10px] " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
                        <path
                            d="M319.1 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7-55.8 .9-115.1 44.5-115.1 133.2 0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM262.5 104.5c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
                    </svg>
                    <p class="mt-[8px] text-[12px] leading-3 tracking-tight font-inter">Download on the <span
                            class="font-extrabold text-[#090909] text-[24px] leading-tight tracking-tight">App
                            Store</span></p>
                </div>
                <div class="flex gap-[8px] w-[170px] h-[65px] bg-[#F4F4F4] rounded-xl mt-[33px] place-items-center">
                    <!-- <svg class="w-[30px] h-[37px] ml-[10px] fill-blue-600" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 448 512">
                        <path
                            d="M293.6 234.3L72.9 13 353.7 174.2 293.6 234.3zM15.3 0C2.3 6.8-6.4 19.2-6.4 35.3l0 441.3c0 16.1 8.7 28.5 21.7 35.3L271.9 255.9 15.3 0zM440.5 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM72.9 499L353.7 337.8 293.6 277.7 72.9 499z" />
                    </svg> -->
                    <img class="w-[30px] h-[37px] ml-[10px]" src="./img/Google Play logo.png" alt="">
                    <p class="mt-[8px] text-[11px] leading-3 tracking-tight w-[108px] h-[35] font-inter">GET IT ON <span
                            class=" text-[#090909] text-[19px] font-medium leading-tight tracking-tight">Google
                            Play</span></p>
                </div>
            </div>
        </div>
        <div class="w-full max-w-[570px] max-h-[478px] bg-[#F2EBDA] rounded-3xl flex items-center justify-center">
            <img class="w-full max-w-[500px] max-h-[452px] mt-7 rotate-[-180]" src="./img/delivery.png"
                alt="Delivery man">
        </div>
    </section>

</body>

</html>
